<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#f7f0db"/>
  <g stroke="#a07c2a" stroke-opacity="0.08">
    <path d="M0 125H800M0 250H800M0 375H800"/>
    <path d="M160 0V500M320 0V500M480 0V500M640 0V500"/>
  </g>
  <!-- pencil -->
  <g transform="translate(200,250) rotate(-25)">
    <rect x="-90" y="-16" width="150" height="32" rx="4" fill="#c9a84c"/>
    <polygon points="60,-16 100,0 60,16" fill="#e8c97a"/>
    <polygon points="90,-6 100,0 90,6" fill="#3d3d3d"/>
    <rect x="-90" y="-16" width="20" height="32" fill="#0b1f3a"/>
  </g>
  <!-- ruler -->
  <g transform="translate(560,180) rotate(15)">
    <rect x="-120" y="-20" width="240" height="40" rx="4" fill="#0b1f3a" opacity="0.9"/>
    <g stroke="#e8c97a" stroke-width="2">
      <line x1="-100" y1="-20" x2="-100" y2="0"/>
      <line x1="-60" y1="-20" x2="-60" y2="0"/>
      <line x1="-20" y1="-20" x2="-20" y2="0"/>
      <line x1="20" y1="-20" x2="20" y2="0"/>
      <line x1="60" y1="-20" x2="60" y2="0"/>
      <line x1="100" y1="-20" x2="100" y2="0"/>
    </g>
  </g>
  <!-- protractor -->
  <g transform="translate(420,360)">
    <path d="M-70,0 A70,70 0 0 1 70,0 Z" fill="none" stroke="#0b1f3a" stroke-width="3"/>
    <path d="M-70,0 A70,70 0 0 1 70,0 Z" fill="#c9a84c" opacity="0.12"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#0b1f3a" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-65" stroke="#a07c2a" stroke-width="1.4" opacity="0.6"/>
    <line x1="0" y1="0" x2="45" y2="-52" stroke="#a07c2a" stroke-width="1.4" opacity="0.6"/>
    <line x1="0" y1="0" x2="-45" y2="-52" stroke="#a07c2a" stroke-width="1.4" opacity="0.6"/>
  </g>
  <!-- apple -->
  <g transform="translate(180,120)">
    <path d="M0,10 C-24,-6 -30,26 -14,40 C-6,47 6,47 14,40 C30,26 24,-6 0,10 Z" fill="#a07c2a" opacity="0.85"/>
    <path d="M0,10 Q4,-4 14,-8" stroke="#0b1f3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(50,420)">
    <rect width="230" height="40" rx="20" fill="#0b1f3a" fill-opacity="0.85"/>
    <text x="115" y="26" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#e8c97a">Ready to Learn</text>
  </g>
</svg>

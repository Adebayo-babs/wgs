<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="60%" stop-color="#14305a"/>
      <stop offset="100%" stop-color="#1e4480"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#e8c97a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8c97a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect width="800" height="500" fill="url(#glow1)"/>
  <!-- grid texture -->
  <g stroke="#c9a84c" stroke-opacity="0.06">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800"/>
    <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/>
  </g>
  <!-- sun rays -->
  <g stroke="#e8c97a" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="400" y1="80" x2="400" y2="30"/>
    <line x1="470" y1="100" x2="505" y2="60"/>
    <line x1="330" y1="100" x2="295" y2="60"/>
    <line x1="520" y1="140" x2="565" y2="115"/>
    <line x1="280" y1="140" x2="235" y2="115"/>
  </g>
  <circle cx="400" cy="150" r="34" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
  <circle cx="400" cy="150" r="34" fill="#e8c97a" opacity="0.15"/>
  <!-- open book -->
  <g transform="translate(400,330)">
    <path d="M-160,-20 Q-80,-55 0,-20 L0,70 Q-80,35 -160,70 Z" fill="#f7f0db" opacity="0.95"/>
    <path d="M160,-20 Q80,-55 0,-20 L0,70 Q80,35 160,70 Z" fill="#faf7f0" opacity="0.95"/>
    <path d="M-160,-20 Q-80,-55 0,-20 L0,70 Q-80,35 -160,70 Z" fill="none" stroke="#0b1f3a" stroke-width="2"/>
    <path d="M160,-20 Q80,-55 0,-20 L0,70 Q80,35 160,70 Z" fill="none" stroke="#0b1f3a" stroke-width="2"/>
    <g stroke="#a07c2a" stroke-width="1.4" opacity="0.55">
      <path d="M-140,-8 Q-75,-38 -12,-10"/>
      <path d="M-135,8 Q-72,-20 -12,8"/>
      <path d="M-130,24 Q-70,-2 -12,26"/>
      <path d="M-125,40 Q-68,16 -12,44"/>
      <path d="M140,-8 Q75,-38 12,-10"/>
      <path d="M135,8 Q72,-20 12,8"/>
      <path d="M130,24 Q70,-2 12,26"/>
      <path d="M125,40 Q68,16 12,44"/>
    </g>
    <path d="M0,-20 L0,70" stroke="#0b1f3a" stroke-width="2"/>
  </g>
  <!-- caption chip -->
  <g transform="translate(60,420)">
    <rect width="230" height="40" rx="20" fill="#0b1f3a" fill-opacity="0.55" stroke="#c9a84c" stroke-opacity="0.5"/>
    <text x="115" y="26" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#e8c97a">Knowledge is Light</text>
  </g>
</svg>

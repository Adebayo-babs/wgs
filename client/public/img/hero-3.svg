<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4480"/>
      <stop offset="100%" stop-color="#0b1f3a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <!-- ground -->
  <rect x="0" y="400" width="800" height="100" fill="#c9a84c" opacity="0.08"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#c9a84c" stroke-opacity="0.35" stroke-width="2"/>
  <!-- building -->
  <g stroke="#e8c97a" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="220" y="260" width="360" height="140" fill="#0b1f3a"/>
    <polygon points="200,260 400,170 600,260" fill="#0b1f3a"/>
    <rect x="370" y="150" width="60" height="45" fill="#0b1f3a"/>
    <polygon points="365,150 400,120 435,150" fill="#0b1f3a"/>
    <line x1="400" y1="120" x2="400" y2="95"/>
    <line x1="388" y1="103" x2="412" y2="103"/>
    <line x1="400" y1="95" x2="400" y2="111"/>
  </g>
  <!-- windows -->
  <g fill="#e8c97a" opacity="0.85">
    <rect x="255" y="300" width="34" height="46" rx="3"/>
    <rect x="325" y="300" width="34" height="46" rx="3"/>
    <rect x="441" y="300" width="34" height="46" rx="3"/>
    <rect x="511" y="300" width="34" height="46" rx="3"/>
  </g>
  <!-- door -->
  <path d="M378,400 L378,335 Q400,315 422,335 L422,400 Z" fill="#c9a84c"/>
  <!-- flag on gable -->
  <path d="M250,240 L250,200" stroke="#e8c97a" stroke-width="2"/>
  <path d="M250,200 L285,210 L250,220 Z" fill="#c9a84c"/>
  <g transform="translate(60,420)">
    <rect width="230" height="40" rx="20" fill="#0b1f3a" fill-opacity="0.6" stroke="#c9a84c" stroke-opacity="0.5"/>
    <text x="115" y="26" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#e8c97a">A Home for Learning</text>
  </g>
</svg>
